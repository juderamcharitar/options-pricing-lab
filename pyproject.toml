[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-pricing-lab"
dynamic = ["version"]
description = "Analytic, neural, and numerical option pricing research lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "threadpoolctl>=3,<4"]

[project.scripts]
options-lab = "options_lab.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "options_lab.__version__"}

[tool.setuptools.package-data]
options_lab = ["web/*.html", "web/*.css", "web/*.js"]
